<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SmartSpin | Calendar</title>
  <link rel="icon" type="image/png" href="../assets/logo_notext.png" />
  <link rel="stylesheet" href="../style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style href = "../style.css"></style>
</head>
<body>
  <canvas id="particles"></canvas>
  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>
  <div class="bg-orb orb-3"></div>
  <div class="bg-orb orb-4"></div>
  <div class="bg-orb orb-5"></div>

  <div class="site-shell">
    <nav class="navbar">
      <a class="brand" href="index.html">
        <img class="brand-logo" src="../assets/smartspin_logo.png" alt="SmartSpin logo" />
        <span class="brand-word"><span class="brand-smart">Smart</span><span class="brand-spin">Spin</span></span>
      </a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="chat.html">Chat</a></li>
        <li><a href="calendar.html" class="active" aria-current="page">Calendar</a></li>
        <li><a href="accounts.html">Account</a></li>
        <li><a href="about.html">About Us</a></li>
        <li><a href="contact.html">Contact Us</a></li>
      </ul>
    </nav>

    <main class="cal-container">
      <div class="cal-header">
        <h1>Laundry Calendar</h1>
        <div class="cal-nav">
          <button id="prevMonth" aria-label="Previous month">‹</button>
          <span id="calTitle" class="cal-title">Month Year</span>
          <button id="nextMonth" aria-label="Next month">›</button>
          <button id="todayBtn">Today</button>
        </div>
      </div>

      <p style="font-family:'Quicksand',sans-serif; color:#5a7aa8; margin-top:0;">
        Click any day to plan loads — pick a type, add notes, and keep your week organized.
      </p>

      <div id="calGrid" class="cal-grid"></div>

      <div class="cal-legend" id="calLegend"></div>
    </main>

    <!-- Modal -->
    <div class="cal-modal-backdrop" id="modalBackdrop">
      <div class="cal-modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <h2 id="modalTitle">Plan Laundry</h2>
        <p class="modal-date" id="modalDate"></p>

        <div class="load-list" id="loadList"></div>

        <form class="add-load-form" id="addLoadForm">
          <label for="loadType">Load type</label>
          <select id="loadType" required></select>

          <label for="loadLabel">Custom label (optional)</label>
          <input id="loadLabel" type="text" maxlength="40" placeholder="e.g. Work shirts, kids' clothes…" />

          <label for="loadNotes">Notes (optional)</label>
          <input id="loadNotes" type="text" maxlength="80" placeholder="e.g. cold wash, delicate cycle…" />

          <div class="modal-actions">
            <button type="submit" class="btn-add">Add load</button>
            <button type="button" class="btn-close" id="closeModal">Close</button>
          </div>
        </form>
      </div>
    </div>

    <footer class="site-footer">
      <div class="footer-wave">
        <svg viewBox="0 0 1080 90" preserveAspectRatio="none">
          <path class="wave-back" d="M0,38 C180,68 360,8 540,38 C720,68 900,8 1080,38 L1080,90 L0,90 Z"/>
          <path class="wave-mid"  d="M0,58 C200,32 400,74 600,50 C800,24 1000,64 1080,54 L1080,90 L0,90 Z"/>
          <path class="wave-foam" d="M0,68 C160,54 320,78 480,62 C640,48 800,72 960,60 C1000,56 1040,62 1080,64 L1080,72 L0,72 Z"/>
        </svg>
      </div>
      <div class="footer-bar">SmartSpin · Laundry made smart</div>
    </footer>
  </div>

  <script src="../Scripts/background.js"></script>
  <script src="../Scripts/buttonwave.js"></script>
  <script src="../Scripts/calendar.js"></script>
  <script>
  fetch('/api/me', { credentials: 'include' })
    .then(r => r.json())
    .then(data => {
      if (!data.loggedIn) window.location.href = '/login.html';
    });
  </script>
</body>
</html>
